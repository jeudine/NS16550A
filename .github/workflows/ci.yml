name: CI

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-24.04
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure Rust toolchain
        run: |
          rustup toolchain install stable
          rustup default stable
      
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy Lint
    runs-on: ubuntu-24.04
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure Rust toolchain
        run: |
          rustup toolchain install stable
          rustup default stable
          rustup target add riscv32imac-unknown-none-elf
      
      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2
      
      - name: Run clippy on library
        run: cargo clippy --lib -- -D warnings
      
      - name: Run clippy on tests
        working-directory: tests
        run: cargo clippy -- -D warnings
      
      - name: Run clippy on host test
        working-directory: tests/host_test
        run: cargo clippy -- -D warnings

  doc:
    name: Documentation
    runs-on: ubuntu-24.04
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure Rust toolchain
        run: |
          rustup toolchain install stable
          rustup default stable
      
      - name: Generate documentation
        run: cargo doc --no-deps --all-features

  test:
    name: UART Driver Test
    runs-on: ubuntu-24.04
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure Rust toolchain
        run: |
          rustup toolchain install stable
          rustup default stable
          rustup target add riscv32imac-unknown-none-elf
      
      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2
      
      - name: Install QEMU
        run: |
          sudo apt update
          sudo apt install -y qemu-system-riscv32
      
      - name: Build project
        run: cargo build --release
      
      - name: Build tests
        working-directory: tests
        run: cargo build --release
      
      - name: Run basic tests
        working-directory: tests
        run: cargo run --release
      
      - name: Build host verification
        working-directory: tests/host_test
        run: cargo build --release
      
      - name: Run host verification
        working-directory: tests/host_test
        run: cargo run --release

  example:
    name: Example Check
    runs-on: ubuntu-24.04
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure Rust toolchain
        run: |
          rustup toolchain install stable
          rustup default stable
          rustup target add riscv32imac-unknown-none-elf
      
      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2
      
      - name: Check example formatting
        working-directory: example
        run: cargo fmt --all -- --check
      
      - name: Run clippy on example
        working-directory: example
        run: cargo clippy -- -D warnings
      
      - name: Build example
        working-directory: example
        run: cargo build --release
